<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan QR & DataMatrix1</title>
    
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #000;
            color: white;
            margin:0;
            padding:20px;
        }
        .container {
            position: relative;
            max-width: 500px;
            margin: 0 auto;
        }
        video {
            width:100%;
            border:5px solid #0f0;
            border-radius:15px;
        }
        .scan-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 260px;
            height: 260px;
            border: 4px solid #00ff00;
            border-radius: 15px;
            box-shadow: 0 0 0 200px rgba(0,0,0,0.7);
            pointer-events: none;
        }
        .scan-line {
            position: absolute;
            top: 20%;
            left: 10%;
            right: 10%;
            height: 3px;
            background: #00ff00;
            box-shadow: 0 0 12px #00ff00;
            animation: scan 2s linear infinite;
        }
        @keyframes scan {
            0% { top: 20%; }
            100% { top: 80%; }
        }
        #result {
            margin:20px;
            padding:15px;
            background:#222;
            border-radius:12px;
            font-size:1.3em;
            min-height: 70px;
        }
        button {
            padding:18px 35px;
            font-size:1.4em;
            margin:15px;
            border-radius:12px;
            background:#0f0;
            color:black;
            font-weight:bold;
        }
    </style>
</head>
<body>
    <h1>📷 Scanare QR & DataMatrix</h1>
   
    <div class="container">
        <video id="video" autoplay playsinline muted></video>
        <div class="scan-overlay" id="overlay" style="display: none;">
            <div class="scan-line"></div>
        </div>
    </div>
    
    <div id="result">Apasă butonul pentru a porni camera</div>
    <button onclick="startCamera()">▶ Pornire Cameră</button>

    <script>
        let html5QrCode = null;

        function startCamera() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = "🔄 Se deschide camera...";

            html5QrCode = new Html5Qrcode("video", {
                formatsToSupport: [
                    Html5QrcodeSupportedFormats.QR_CODE,
                    Html5QrcodeSupportedFormats.DATA_MATRIX
                ]
            });

            const config = {
                fps: 15,
                qrbox: { width: 260, height: 260 },
                aspectRatio: 1.0,
                disableFlip: false
            };

            html5QrCode.start(
                { facingMode: "environment" },
                config,
                onScanSuccess,
                onScanFailure
            )
            .then(() => {
                document.getElementById('video').style.display = "block";
                document.getElementById('overlay').style.display = "block";
                resultDiv.innerHTML = "✅ Încadrează codul (QR sau DataMatrix) în pătratul verde";
            })
            .catch(err => {
                console.error(err);
                resultDiv.innerHTML = `<span style="color:red">Eroare la pornire: ${err.message || err}</span>`;
            });
        }

        function onScanSuccess(decodedText, decodedResult) {
            document.getElementById('result').innerHTML = `✅ Scanat:<br><b>${decodedText}</b>`;

            const returnUrl = new URLSearchParams(window.location.search).get('return');
            if (returnUrl) {
                let finalUrl = decodeURIComponent(returnUrl);
                finalUrl += (finalUrl.includes('?') ? '&' : '?') + 'code=' + encodeURIComponent(decodedText);
                setTimeout(() => { window.location.href = finalUrl; }, 700);
            } else {
                alert("Scanat: " + decodedText);
            }

            stopScanning();
        }

        function onScanFailure(error) {
            // Eroare normală când nu găsește cod - ignorăm
        }

        function stopScanning() {
            if (html5QrCode) {
                html5QrCode.stop().catch(() => {});
            }
        }

        window.addEventListener('beforeunload', stopScanning);
    </script>
</body>
</html>
