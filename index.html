<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan QR & DataMatrix</title>
    
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #000;
            color: white;
            margin:0;
            padding:20px;
        }
        .container {
            position: relative;
            max-width: 500px;
            margin: 0 auto;
        }
        video {
            width:100%;
            border:5px solid #0f0;
            border-radius:15px;
            display: none;
        }
        .scan-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 260px;
            height: 260px;
            border: 4px solid #00ff00;
            border-radius: 15px;
            box-shadow: 0 0 0 200px rgba(0,0,0,0.7);
            pointer-events: none;
            display: none;
        }
        .scan-line {
            position: absolute;
            top: 20%;
            left: 10%;
            right: 10%;
            height: 3px;
            background: #00ff00;
            box-shadow: 0 0 12px #00ff00;
            animation: scan 2s linear infinite;
        }
        @keyframes scan {
            0% { top: 20%; }
            100% { top: 80%; }
        }
        #result {
            margin:20px;
            padding:15px;
            background:#222;
            border-radius:12px;
            font-size:1.3em;
        }
        button {
            padding:18px 35px;
            font-size:1.4em;
            margin:15px;
            border-radius:12px;
            background:#0f0;
            color:black;
            font-weight:bold;
        }
    </style>
</head>
<body>
    <h1>📷 Scanare QR & DataMatrix</h1>
   
    <div class="container">
        <video id="video" autoplay playsinline muted></video>
        <div class="scan-overlay" id="overlay">
            <div class="scan-line"></div>
        </div>
    </div>
    
    <div id="result">Apasă butonul pentru a porni camera</div>
    <button onclick="startCamera()">▶ Pornire Cameră</button>

    <script>
        let video = document.getElementById('video');
        let overlay = document.getElementById('overlay');
        let stream = null;
        let html5QrCode = null;

        function startCamera() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = "Se deschide camera...";

            navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment" }
            })
            .then(s => {
                stream = s;
                video.srcObject = stream;
                video.style.display = "block";
                overlay.style.display = "block";
                resultDiv.innerHTML = "✅ Încadrează codul (QR sau DataMatrix) în pătratul verde";
                
                // Scanare cu html5-qrcode
                html5QrCode = new Html5Qrcode("video", { 
                    formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE, Html5QrcodeSupportedFormats.DATA_MATRIX] 
                });
                
                html5QrCode.start(stream, { fps: 10, qrbox: { width: 250, height: 250 }}, 
                    (decodedText) => {
                        resultDiv.innerHTML = `✅ Scanat:<br><b>${decodedText}</b>`;
                        const returnUrl = new URLSearchParams(window.location.search).get('return');
                        if (returnUrl) {
                            let finalUrl = decodeURIComponent(returnUrl);
                            finalUrl += (finalUrl.includes('?') ? '&' : '?') + 'code=' + encodeURIComponent(decodedText);
                            window.location.href = finalUrl;
                        }
                        stopAll();
                    }, 
                    () => {}
                );
            })
            .catch(err => {
                resultDiv.innerHTML = `<span style="color:red">Eroare: ${err.message}</span>`;
                alert("Eroare cameră: " + err.message);
            });
        }

        function stopAll() {
            if (html5QrCode) html5QrCode.stop().catch(() => {});
            if (stream) stream.getTracks().forEach(t => t.stop());
        }

        window.addEventListener('beforeunload', stopAll);
    </script>
</body>
</html>
