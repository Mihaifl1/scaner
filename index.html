<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan QR & DataMatrix</title>
    
    <!-- jsQR pentru QR + ZXing pentru DataMatrix -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>
    <script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #000;
            color: white;
            margin:0;
            padding:20px;
        }
        .container {
            position: relative;
            max-width: 500px;
            margin: 0 auto;
        }
        video {
            width:100%;
            border:5px solid #0f0;
            border-radius:15px;
            display: none;
        }
        .scan-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 260px;
            height: 260px;
            border: 4px solid #00ff00;
            border-radius: 15px;
            box-shadow: 0 0 0 200px rgba(0,0,0,0.7);
            pointer-events: none;
            display: none;
        }
        .scan-line {
            position: absolute;
            top: 20%;
            left: 10%;
            right: 10%;
            height: 3px;
            background: #00ff00;
            box-shadow: 0 0 12px #00ff00;
            animation: scan 2s linear infinite;
        }
        @keyframes scan {
            0% { top: 20%; }
            100% { top: 80%; }
        }
        #result {
            margin:20px;
            padding:15px;
            background:#222;
            border-radius:12px;
            font-size:1.3em;
        }
        button {
            padding:18px 35px;
            font-size:1.4em;
            margin:15px;
            border-radius:12px;
            background:#0f0;
            color:black;
            font-weight:bold;
        }
    </style>
</head>
<body>
    <h1>📷 Scanare QR & DataMatrix</h1>
   
    <div class="container">
        <video id="video" autoplay playsinline muted></video>
        <div class="scan-overlay" id="overlay">
            <div class="scan-line"></div>
        </div>
    </div>
    
    <div id="result">Apasă butonul pentru a porni camera</div>
    <button onclick="startCamera()">▶ Pornire Cameră</button>

    <script>
        let video = document.getElementById('video');
        let overlay = document.getElementById('overlay');
        let stream = null;
        let scanning = true;

        const hints = new Map();
        hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
            ZXing.BarcodeFormat.QR_CODE,
            ZXing.BarcodeFormat.DATA_MATRIX
        ]);

        const reader = new ZXing.BrowserMultiFormatReader(hints);

        function startCamera() {
            document.getElementById('result').innerHTML = "Se deschide camera...";

            navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment" }
            })
            .then(s => {
                stream = s;
                video.srcObject = stream;
                video.style.display = "block";
                overlay.style.display = "block";
                
                document.getElementById('result').innerHTML = "✅ Încadrează codul (QR sau DataMatrix) în pătratul verde";
                scanLoop();
            })
            .catch(err => {
                document.getElementById('result').innerHTML = `<span style="color:red">Eroare: ${err.message}</span>`;
                alert("Eroare cameră: " + err.message);
            });
        }

        async function scanLoop() {
            if (!scanning) return;

            if (video.videoWidth < 100) {
                setTimeout(scanLoop, 200);
                return;
            }

            try {
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0);

                // Încercăm cu ZXing (suportă QR + DataMatrix)
                const result = await reader.decodeFromImageElement(canvas);
                if (result && result.text) {
                    handleSuccess(result.text);
                    return;
                }
            } catch (e) {
                // nu a găsit cod
            }

            setTimeout(scanLoop, 180);
        }

        function handleSuccess(scanned) {
            scanning = false;
            document.getElementById('result').innerHTML = `✅ Scanat:<br><b>${scanned}</b>`;

            const returnUrl = new URLSearchParams(window.location.search).get('return');
            if (returnUrl) {
                let finalUrl = decodeURIComponent(returnUrl);
                finalUrl += (finalUrl.includes('?') ? '&' : '?') + 'code=' + encodeURIComponent(scanned);
                window.location.href = finalUrl;
            } else {
                alert("Scanat: " + scanned);
            }

            if (stream) stream.getTracks().forEach(t => t.stop());
        }

        window.addEventListener('beforeunload', () => {
            scanning = false;
            if (stream) stream.getTracks().forEach(t => t.stop());
        });
    </script>
</body>
</html>
