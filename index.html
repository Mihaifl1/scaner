<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scanner QR + DataMatrixs/title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
    background:#000;
    color:white;
    font-family:Arial;
    text-align:center;
    margin:0;
    padding:20px;
}

#reader{
    width:100%;
    max-width:500px;
    margin:auto;
    border:5px solid #00ff00;
    border-radius:20px;
    overflow:hidden;
}

#result{
    margin-top:20px;
    background:#222;
    padding:15px;
    border-radius:15px;
    font-size:1.2em;
}

button{
    padding:18px 35px;
    font-size:1.3em;
    border:none;
    border-radius:15px;
    background:#00ff00;
    font-weight:bold;
    margin-top:20px;
}

</style>
</head>

<body>

<h1>📷 QR + DataMatrix Scanner</h1>

<div id="reader"></div>

<div id="result">
Apasă Start
</div>

<button onclick="startScanner()">
▶ Start Scanner
</button>

<script>

let scanner;

function startScanner(){

    document.getElementById("result").innerHTML =
        "Se pornește camera...";

    scanner = new Html5Qrcode("reader");

    scanner.start(
        {
            facingMode: "environment"
        },

        {
            fps: 15,
            qrbox: {
                width: 280,
                height: 280
            },

            formatsToSupport: [

                Html5QrcodeSupportedFormats.QR_CODE,
                Html5QrcodeSupportedFormats.DATA_MATRIX,

                Html5QrcodeSupportedFormats.CODE_128,
                Html5QrcodeSupportedFormats.CODE_39,
                Html5QrcodeSupportedFormats.EAN_13
            ]
        },

        (decodedText, decodedResult) => {

            navigator.vibrate?.(200);

            document.getElementById("result").innerHTML =
                "✅ Scanat:<br><b>" + decodedText + "</b>";

            scanner.stop();

            const returnUrl =
                new URLSearchParams(window.location.search)
                .get('return');

            if(returnUrl){

                let finalUrl =
                    decodeURIComponent(returnUrl);

                finalUrl +=
                    (finalUrl.includes('?') ? '&' : '?')
                    + 'code='
                    + encodeURIComponent(decodedText);

                setTimeout(() => {
                    window.location.href = finalUrl;
                }, 500);
            }
        },

        (errorMessage) => {
        }
    )
    .catch(err => {

        document.getElementById("result").innerHTML =
            "❌ Eroare cameră: " + err;
    });
}

</script>

</body>
</html>
