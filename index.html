<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>test</title>

<script src="https://unpkg.com/@zxing/library@latest"></script>

<style>

body{
    font-family:Arial;
    text-align:center;
    background:#000;
    color:white;
    margin:0;
    padding:20px;
}

.container{
    position:relative;
    max-width:500px;
    margin:auto;
}

video{
    width:100%;
    border:5px solid #00ff00;
    border-radius:15px;
    display:none;
    background:black;
}

.scan-overlay{

    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    width:260px;
    height:260px;

    border:4px solid #00ff00;

    border-radius:15px;

    box-shadow:0 0 0 200px rgba(0,0,0,0.7);

    pointer-events:none;

    display:none;
}

.scan-line{

    position:absolute;

    top:20%;
    left:10%;
    right:10%;

    height:3px;

    background:#00ff00;

    box-shadow:0 0 12px #00ff00;

    animation:scan 2s linear infinite;
}

@keyframes scan{

    0%{
        top:20%;
    }

    100%{
        top:80%;
    }
}

#result{

    margin:20px;

    padding:15px;

    background:#222;

    border-radius:12px;

    font-size:1.2em;

    word-break:break-all;
}

button{

    padding:18px 35px;

    font-size:1.2em;

    margin:10px;

    border-radius:12px;

    background:#00ff00;

    color:black;

    font-weight:bold;

    border:none;
}

.flash-btn{
    background:#ffaa00;
}

.stop-btn{
    background:#ff3333;
    color:white;
}

</style>
</head>

<body>

<h1>📷 QR + DataMatrix</h1>

<div class="container">

    <video
        id="video"
        autoplay
        playsinline>
    </video>

    <div
        class="scan-overlay"
        id="overlay">

        <div class="scan-line"></div>

    </div>

</div>

<div id="result">

    Apasă START

</div>

<button onclick="startCamera()">

    ▶ START

</button>

<button
    class="flash-btn"
    onclick="toggleFlash()">

    🔦 FLASH

</button>

<button
    class="stop-btn"
    onclick="stopCamera()">

    ■ STOP

</button>

<script>

let video =
    document.getElementById('video');

let overlay =
    document.getElementById('overlay');

let stream = null;

let scanning = false;

let codeReader =
    new ZXing.BrowserMultiFormatReader();

async function startCamera(){

    try{

        document.getElementById('result').innerHTML =
            "📷 Se deschide camera...";

        stream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:{
                        ideal:"environment"
                    }
                },

                audio:false
            });

        video.srcObject = stream;

        video.style.display = "block";

        overlay.style.display = "block";

        scanning = true;

        document.getElementById('result').innerHTML =
            "✅ Scanează QR / DataMatrix";

        scanLoop();

    }catch(err){

        console.error(err);

        document.getElementById('result').innerHTML =
            `
            <span style="color:red">
                ❌ ${err.message}
            </span>
            `;

        alert("Eroare cameră: " + err.message);
    }
}

function stopCamera(){

    scanning = false;

    if(stream){

        stream.getTracks()
            .forEach(track => track.stop());
    }

    video.style.display = "none";

    overlay.style.display = "none";

    document.getElementById('result').innerHTML =
        "■ Scanner oprit";
}

async function scanLoop(){

    if(!scanning)
        return;

    try{

        const result =
            await codeReader.decodeOnceFromVideoElement(video);

        if(result){

            navigator.vibrate?.(200);

            const scanned =
                result.getText();

            document.getElementById('result').innerHTML =
                `
                ✅ Scanat:<br><br>

                <b>${scanned}</b>

                <br><br>

                Tip:
                ${result.getBarcodeFormat()}
                `;

            stopCamera();

            const returnUrl =
                new URLSearchParams(window.location.search)
                .get('return');

            if(returnUrl){

                let finalUrl =
                    decodeURIComponent(returnUrl);

                finalUrl +=
                    (finalUrl.includes('?') ? '&' : '?')
                    + 'code='
                    + encodeURIComponent(scanned);

                setTimeout(() => {

                    window.location.href =
                        finalUrl;

                },500);
            }
        }

    }catch(e){
    }

    requestAnimationFrame(scanLoop);
}

async function toggleFlash(){

    if(!stream)
        return;

    const track =
        stream.getVideoTracks()[0];

    const capabilities =
        track.getCapabilities();

    if(!capabilities.torch){

        alert("Flash indisponibil");

        return;
    }

    const settings =
        track.getSettings();

    await track.applyConstraints({

        advanced:[{
            torch: !settings.torch
        }]
    });
}

</script>

</body>
</html>
