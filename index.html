<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ZXing QR + DataMatrix</title>

<script src="https://unpkg.com/@zxing/library@latest"></script>

<style>

body{
    margin:0;
    padding:20px;
    background:#000;
    color:white;
    font-family:Arial;
    text-align:center;
}

.container{
    position:relative;
    max-width:500px;
    margin:auto;
}

video{
    width:100%;
    border:5px solid #00ff00;
    border-radius:15px;
    background:black;
    display:none;
}

.scan-overlay{

    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    width:260px;
    height:260px;

    border:4px solid #00ff00;

    border-radius:15px;

    box-shadow:0 0 0 200px rgba(0,0,0,0.7);

    pointer-events:none;

    display:none;
}

.scan-line{

    position:absolute;

    left:10%;
    right:10%;

    height:3px;

    background:#00ff00;

    box-shadow:0 0 15px #00ff00;

    animation:scan 2s linear infinite;
}

@keyframes scan{

    0%{
        top:20%;
    }

    100%{
        top:80%;
    }
}

button{

    padding:18px 35px;

    font-size:1.2em;

    margin:10px;

    border:none;

    border-radius:12px;

    font-weight:bold;
}

.start-btn{
    background:#00ff00;
}

.stop-btn{
    background:#ff3333;
    color:white;
}

.flash-btn{
    background:#ffaa00;
}

#result{

    margin-top:20px;

    background:#222;

    padding:20px;

    border-radius:15px;

    font-size:1.2em;

    word-break:break-all;
}

</style>
</head>

<body>

<h1>📷 ZXing Scanner</h1>

<div class="container">

    <video
        id="video"
        autoplay
        playsinline>
    </video>

    <div
        class="scan-overlay"
        id="overlay">

        <div class="scan-line"></div>

    </div>

</div>

<div id="result">

    Apasă START

</div>

<button
    class="start-btn"
    onclick="startCamera()">

    ▶ START

</button>

<button
    class="flash-btn"
    onclick="toggleFlash()">

    🔦 FLASH

</button>

<button
    class="stop-btn"
    onclick="stopCamera()">

    ■ STOP

</button>

<script>

const video =
    document.getElementById('video');

const overlay =
    document.getElementById('overlay');

const resultDiv =
    document.getElementById('result');

const canvas =
    document.createElement('canvas');

const ctx =
    canvas.getContext('2d');

let stream = null;

let scanning = false;

const hints = new Map();

hints.set(
    ZXing.DecodeHintType.POSSIBLE_FORMATS,
    [

        ZXing.BarcodeFormat.QR_CODE,
        ZXing.BarcodeFormat.DATA_MATRIX,
        ZXing.BarcodeFormat.CODE_128,
        ZXing.BarcodeFormat.CODE_39,
        ZXing.BarcodeFormat.EAN_13,
        ZXing.BarcodeFormat.PDF_417,
        ZXing.BarcodeFormat.AZTEC
    ]
);

const reader =
    new ZXing.MultiFormatReader();

reader.setHints(hints);

async function startCamera(){

    try{

        resultDiv.innerHTML =
            "📷 Se deschide camera...";

        stream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:{
                        ideal:"environment"
                    }
                },

                audio:false
            });

        video.srcObject = stream;

        await video.play();

        video.style.display = "block";

        overlay.style.display = "block";

        scanning = true;

        resultDiv.innerHTML =
            "✅ Scanează codul";

        scanLoop();

    }catch(err){

        console.error(err);

        resultDiv.innerHTML =
            `
            <span style="color:red">
                ❌ ${err.message}
            </span>
            `;
    }
}

function stopCamera(){

    scanning = false;

    if(stream){

        stream.getTracks()
            .forEach(track => track.stop());
    }

    video.style.display = "none";

    overlay.style.display = "none";

    resultDiv.innerHTML =
        "■ Scanner oprit";
}

function scanLoop(){

    if(!scanning)
        return;

    if(video.readyState !== video.HAVE_ENOUGH_DATA){

        requestAnimationFrame(scanLoop);

        return;
    }

    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;

    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );

    try{

        const luminanceSource =
            new ZXing.HTMLCanvasElementLuminanceSource(canvas);

        const binaryBitmap =
            new ZXing.BinaryBitmap(

                new ZXing.HybridBinarizer(
                    luminanceSource
                )
            );

        const result =
            reader.decode(binaryBitmap);

        if(result){

            navigator.vibrate?.(200);

            const scanned =
                result.getText();

            resultDiv.innerHTML =
                `
                ✅ Scanat:<br><br>

                <b>${scanned}</b>

                <br><br>

                Tip:
                ${result.getBarcodeFormat()}
                `;

            stopCamera();

            const returnUrl =
                new URLSearchParams(window.location.search)
                .get('return');

            if(returnUrl){

                let finalUrl =
                    decodeURIComponent(returnUrl);

                finalUrl +=
                    (finalUrl.includes('?') ? '&' : '?')
                    + 'code='
                    + encodeURIComponent(scanned);

                setTimeout(() => {

                    window.location.href =
                        finalUrl;

                },500);
            }

            return;
        }

    }catch(e){
    }

    requestAnimationFrame(scanLoop);
}

async function toggleFlash(){

    if(!stream)
        return;

    const track =
        stream.getVideoTracks()[0];

    const capabilities =
        track.getCapabilities();

    if(!capabilities.torch){

        alert("Flash indisponibil");

        return;
    }

    const settings =
        track.getSettings();

    await track.applyConstraints({

        advanced:[{
            torch: !settings.torch
        }]
    });
}

</script>

</body>
</html>
