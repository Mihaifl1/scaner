<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Cameră</title>
    <style>
        body { font-family: Arial; text-align: center; background: #111; color: white; padding: 20px; }
        video { width:100%; max-width:500px; border:5px solid #0f0; border-radius:15px; }
        button { padding:20px 40px; font-size:1.5em; margin:20px; background:#0f0; color:black; border-radius:12px; }
    </style>
</head>
<body>
    <h1>Test Permisiune Cameră</h1>
    <button onclick="testCamera()">📷 Testează Camera Acum</button>
    <video id="video" autoplay playsinline></video>
    <div id="status">Apasă butonul...</div>

    <script>
        function testCamera() {
            document.getElementById('status').innerHTML = "Se cere permisiunea...";

            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment" } 
            })
            .then(stream => {
                document.getElementById('video').srcObject = stream;
                document.getElementById('status').innerHTML = "<span style='color:#0f0'>✅ Camera pornită!</span>";
            })
            .catch(err => {
                document.getElementById('status').innerHTML = `<span style='color:red'>Eroare: ${err.name} - ${err.message}</span>`;
                alert("Eroare: " + err.name + "\n" + err.message);
            });
        }
    </script>
</body>
</html>
