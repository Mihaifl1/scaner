<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan QR & DataMatrix</title>
    
    <!-- Bibliotecile -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #000;
            color: white;
            margin:0;
            padding:20px;
        }
        .container {
            position: relative;
            max-width: 500px;
            margin: 0 auto;
        }
        video {
            width:100%;
            border:5px solid #0f0;
            border-radius:15px;
            display: none; /* ascuns initial */
        }
        .scan-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 260px;
            height: 260px;
            border: 4px solid #00ff00;
            border-radius: 15px;
            box-shadow: 0 0 0 200px rgba(0,0,0,0.7);
            pointer-events: none;
            display: none; /* ascuns initial */
        }
        .scan-line {
            position: absolute;
            top: 20%;
            left: 10%;
            right: 10%;
            height: 3px;
            background: #00ff00;
            box-shadow: 0 0 12px #00ff00;
            animation: scan 2s linear infinite;
        }
        @keyframes scan {
            0% { top: 20%; }
            100% { top: 80%; }
        }
        #result {
            margin:20px;
            padding:15px;
            background:#222;
            border-radius:12px;
            font-size:1.3em;
        }
        button {
            padding:18px 35px;
            font-size:1.4em;
            margin:15px;
            border-radius:12px;
            background:#0f0;
            color:black;
            font-weight:bold;
        }
    </style>
</head>
<body>
    <h1>📷 Scanare QR Code & DataMatrix</h1>
   
    <div class="container">
        <video id="video" autoplay playsinline></video>
        <div class="scan-overlay" id="overlay">
            <div class="scan-line"></div>
        </div>
    </div>
    
    <div id="result">Apasă butonul pentru a porni camera</div>
    <button onclick="startCamera()">▶ Pornire Cameră</button>

    <script>
        let video = document.getElementById('video');
        let overlay = document.getElementById('overlay');
        let stream = null;
        let html5QrCode = null;
        let isScanning = false;

        function startCamera() {
            document.getElementById('result').innerHTML = "Se deschide camera...";

            // === Folosim html5-qrcode pentru QR + DataMatrix ===
            html5QrCode = new Html5Qrcode("video", { 
                formatsToSupport: [
                    Html5QrcodeSupportedFormats.QR_CODE,
                    Html5QrcodeSupportedFormats.DATA_MATRIX
                ]
            });

            const config = {
                fps: 15,
                qrbox: { width: 260, height: 260 },
                aspectRatio: 1.0
            };

            html5QrCode.start(
                { facingMode: "environment" },
                config,
                onScanSuccess,
                onScanError
            ).then(() => {
                video.style.display = "block";
                overlay.style.display = "block";
                document.getElementById('result').innerHTML = "✅ Încadrează codul (QR sau DataMatrix) în pătratul verde";
                isScanning = true;
            }).catch(err => {
                document.getElementById('result').innerHTML = `<span style="color:red">Eroare: ${err}</span>`;
                alert("Eroare cameră: " + err);
            });
        }

        function onScanSuccess(decodedText, decodedResult) {
            document.getElementById('result').innerHTML = `✅ Scanat:<br><b>${decodedText}</b>`;

            // Păstrăm comportamentul original cu parametrul ?return=
            const returnUrl = new URLSearchParams(window.location.search).get('return');
            if (returnUrl) {
                let finalUrl = decodeURIComponent(returnUrl);
                finalUrl += (finalUrl.includes('?') ? '&' : '?') + 'code=' + encodeURIComponent(decodedText);
                window.location.href = finalUrl;
            } else {
                alert("Scanat: " + decodedText);
            }

            stopScanning();
        }

        function onScanError(errorMessage) {
            // Eroare normală când nu detectează cod
        }

        function stopScanning() {
            if (html5QrCode && isScanning) {
                html5QrCode.stop().then(() => {
                    isScanning = false;
                }).catch(() => {});
            }
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
            }
        }

        // Oprește camera la ieșire din pagină
        window.addEventListener('beforeunload', stopScanning);
    </script>
</body>
</html>
