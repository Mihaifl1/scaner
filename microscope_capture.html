<!DOCTYPE html>
<html lang="ro">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Microscope Capture</title>

<style>
html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
    font-family:Arial;
}

video{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    object-fit:contain;
    background:black;
    z-index:1;
}

.controls{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    z-index:9999;
    background:rgba(0,0,0,0.65);
    padding:15px;
    border-radius:18px;
    display:flex;
    gap:15px;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
}

button{
    padding:15px 22px;
    border:none;
    border-radius:12px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.start-btn{
    background:#00aa00;
    color:white;
}

.capture-btn{
    background:#ff8800;
    color:white;
}

.close-btn{
    background:red;
    color:white;
}

select{
    padding:12px;
    border-radius:10px;
    font-size:16px;
    min-width:320px;
}

#status{
    position:fixed;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    z-index:9999;
    background:rgba(0,0,0,0.6);
    color:#00ff00;
    padding:10px 18px;
    border-radius:12px;
    font-size:18px;
}
</style>
</head>

<body>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas" style="display:none;"></canvas>

<div id="status">
    Aștept acces cameră...
</div>

<div class="controls">

    <button
        class="start-btn"
        onclick="autoStartCamera()">
        Permite / Pornește camera
    </button>

    <select id="cameraSelect">
        <option value="">
            Selectează camera
        </option>
    </select>

    <button
        class="capture-btn"
        onclick="captureImage()">
        📸 Capturează
    </button>

    <button
        class="close-btn"
        onclick="closeWindow()">
        Închide
    </button>

</div>

<script>
const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const statusDiv =
    document.getElementById("status");

const cameraSelect =
    document.getElementById("cameraSelect");

let currentStream = null;

const UPLOAD_URL =
    "http://192.168.66.240/upload_microscope.php";

/************************************************
 * AUTO START
 ************************************************/
window.addEventListener("load", async () => {
    await autoStartCamera();
});

/************************************************
 * AUTO DETECT + START CAMERA
 ************************************************/
async function autoStartCamera(){

    try{

        statusDiv.innerHTML =
            "Cer permisiune cameră...";

        const tempStream =
            await navigator.mediaDevices.getUserMedia({
                video:true,
                audio:false
            });

        tempStream
        .getTracks()
        .forEach(track => track.stop());

        const devices =
            await navigator.mediaDevices.enumerateDevices();

        const videoDevices =
            devices.filter(
                device => device.kind === "videoinput"
            );

        cameraSelect.innerHTML = "";

        let selectedDeviceId = null;

        videoDevices.forEach((device,index)=>{

            const option =
                document.createElement("option");

            option.value =
                device.deviceId;

            option.text =
                device.label ||
                "Camera " + (index + 1);

            cameraSelect.appendChild(option);

            if(
                device.label &&
                device.label.toLowerCase().includes("dino")
            ){
                selectedDeviceId =
                    device.deviceId;

                option.selected = true;
            }
        });

        if(!selectedDeviceId && videoDevices.length > 0){
            selectedDeviceId =
                videoDevices[0].deviceId;

            cameraSelect.selectedIndex = 0;
        }

        if(!selectedDeviceId){
            statusDiv.innerHTML =
                "❌ Nu am găsit cameră";
            return;
        }

        if(currentStream){
            currentStream
            .getTracks()
            .forEach(track => track.stop());
        }

        currentStream =
            await navigator.mediaDevices.getUserMedia({
                video:{
                    deviceId:{ exact:selectedDeviceId },
                    width:{ ideal:1920 },
                    height:{ ideal:1080 },
                    frameRate:{ ideal:30 }
                },
                audio:false
            });

        video.srcObject =
            currentStream;

        await video.play();

        statusDiv.innerHTML =
            "✅ Camera pornită";

    }catch(err){

        console.log(err);

        statusDiv.innerHTML =
            "❌ " + err.message;
    }
}

/************************************************
 * CAPTURE + UPLOAD SERVER
 ************************************************/
async function captureImage(){

    if(video.videoWidth === 0){
        alert("Camera nu este pornită!");
        return;
    }

    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;

    const ctx =
        canvas.getContext("2d");

    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );

    const imageData =
        canvas.toDataURL(
            "image/jpeg",
            0.92
        );

    statusDiv.innerHTML =
        "Trimit imaginea pe server...";

    try{

        const response =
            await fetch(UPLOAD_URL, {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    image:imageData
                })
            });

        const result =
            await response.json();

        if(!result.success){
            alert(
                "Eroare upload: " +
                (result.error || "necunoscut")
            );
            return;
        }

        statusDiv.innerHTML =
            "✅ Imagine salvată";

        const returnUrl =
            new URLSearchParams(
                window.location.search
            ).get("return");

        if(returnUrl){

            const separator =
                decodeURIComponent(returnUrl).includes("?")
                ? "&"
                : "?";

            window.location.href =
                decodeURIComponent(returnUrl) +
                separator +
                "captured_file=" +
                encodeURIComponent(result.file);

        }else{

            alert(
                "Imagine salvată: " +
                result.file
            );
        }

    }catch(err){

        console.log(err);

        alert(
            "Upload blocat sau eroare rețea. " +
            "Dacă pagina este HTTPS și serverul este HTTP, Chrome poate bloca trimiterea."
        );
    }
}

/************************************************
 * ÎNCHIDE
 ************************************************/
function closeWindow(){

    if(currentStream){
        currentStream
        .getTracks()
        .forEach(track => track.stop());
    }

    window.close();
}
</script>

</body>
</html>
