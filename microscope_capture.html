<!DOCTYPE html>
<html lang="ro">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Microscope Capture</title>

<style>

html,
body{

    margin:0;

    padding:0;

    width:100%;

    height:100%;

    overflow:hidden;

    background:black;

    font-family:Arial;
}

/************************************************
 * VIDEO FULLSCREEN
 ************************************************/

video{

    position:fixed;

    top:0;
    left:0;

    width:100vw;

    height:100vh;

    object-fit:contain;

    background:black;

    z-index:1;
}

/************************************************
 * CONTROLS
 ************************************************/

.controls{

    position:fixed;

    bottom:20px;

    left:50%;

    transform:translateX(-50%);

    z-index:9999;

    background:rgba(0,0,0,0.65);

    padding:15px;

    border-radius:18px;

    display:flex;

    gap:15px;

    flex-wrap:wrap;

    justify-content:center;

    align-items:center;

    backdrop-filter:blur(10px);
}

/************************************************
 * BUTTONS
 ************************************************/

button{

    padding:15px 22px;

    border:none;

    border-radius:12px;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;
}

.start-btn{

    background:#00aa00;

    color:white;
}

.capture-btn{

    background:#ff8800;

    color:white;
}

.close-btn{

    background:red;

    color:white;
}

/************************************************
 * SELECT
 ************************************************/

select{

    padding:12px;

    border-radius:10px;

    font-size:16px;

    min-width:320px;
}

/************************************************
 * STATUS
 ************************************************/

#status{

    position:fixed;

    top:15px;

    left:50%;

    transform:translateX(-50%);

    z-index:9999;

    background:rgba(0,0,0,0.6);

    color:#00ff00;

    padding:10px 18px;

    border-radius:12px;

    font-size:18px;
}

</style>

</head>

<body>

<video
    id="video"
    autoplay
    playsinline
    muted>
</video>

<canvas
    id="canvas"
    style="display:none;">
</canvas>

<div id="status">

    Aștept acces cameră...

</div>

<div class="controls">

    <button
        class="start-btn"
        onclick="requestCameraPermission()">

        Permite acces cameră

    </button>

    <select id="cameraSelect">

        <option value="">
            Selectează camera
        </option>

    </select>

    <button
        class="start-btn"
        onclick="startSelectedCamera()">

        Pornește camera

    </button>

    <button
        class="capture-btn"
        onclick="captureImage()">

        📸 Capturează

    </button>

    <button
        class="close-btn"
        onclick="closeWindow()">

        Închide

    </button>

</div>

<script>

/************************************************
 * VARIABILE
 ************************************************/

const video =
    document.getElementById(
        "video"
    );

const canvas =
    document.getElementById(
        "canvas"
    );

const statusDiv =
    document.getElementById(
        "status"
    );

const cameraSelect =
    document.getElementById(
        "cameraSelect"
    );

let currentStream = null;

/************************************************
 * AUTO START
 ************************************************/

window.addEventListener(
    "load",
    async () => {

        await autoStartCamera();
    }
);

/************************************************
 * AUTO DETECT + START
 ************************************************/

async function autoStartCamera(){

    try{

        statusDiv.innerHTML =
            "Cer permisiune cameră...";

        /****************************************
         * CERE ACCES
         ****************************************/

        const tempStream =
            await navigator.mediaDevices
            .getUserMedia({

                video:true,
                audio:false
            });

        tempStream
        .getTracks()
        .forEach(
            track => track.stop()
        );

        /****************************************
         * LISTĂ CAMERE
         ****************************************/

        const devices =
            await navigator.mediaDevices
            .enumerateDevices();

        const videoDevices =
            devices.filter(
                device =>
                device.kind === "videoinput"
            );

        cameraSelect.innerHTML = "";

        let selectedDeviceId = null;

        videoDevices.forEach(
            (device,index)=>{

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                device.deviceId;

            option.text =
                device.label ||
                "Camera " + (index + 1);

            cameraSelect.appendChild(
                option
            );

            /************************************
             * AUTO DINO
             ************************************/

            if(
                device.label
                .toLowerCase()
                .includes("dino")
            ){

                selectedDeviceId =
                    device.deviceId;

                option.selected = true;
            }
        });

        /****************************************
         * DACĂ NU GĂSEȘTE DINO
         ****************************************/

        if(!selectedDeviceId &&
           videoDevices.length > 0){

            selectedDeviceId =
                videoDevices[0].deviceId;

            cameraSelect.selectedIndex = 0;
        }

        /****************************************
         * PORNEȘTE CAMERA
         ****************************************/

        currentStream =
            await navigator.mediaDevices
            .getUserMedia({

                video:{

                    deviceId:{
                        exact:selectedDeviceId
                    },

                    width:{
                        ideal:1920
                    },

                    height:{
                        ideal:1080
                    },

                    frameRate:{
                        ideal:30
                    }
                },

                audio:false
            });

        video.srcObject =
            currentStream;

        await video.play();

        statusDiv.innerHTML =
            "✅ Camera pornită automat";

    }catch(err){

        console.log(err);

        statusDiv.innerHTML =
            "❌ " + err.message;
    }
}

/************************************************
 * CAPTUREAZĂ
 ************************************************/

function captureImage(){

    if(video.videoWidth === 0){

        alert(
            "Camera nu este pornită!"
        );

        return;
    }

    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;

    const ctx =
        canvas.getContext("2d");

    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );

    const imageData =
        canvas.toDataURL(
            "image/jpeg",
            0.95
        );

    localStorage.setItem(
        'capturedImage',
        imageData
    );

    statusDiv.innerHTML =
        "✅ Imagine capturată";

    setTimeout(() => {

        window.close();

    }, 300);
}

/************************************************
 * ÎNCHIDE
 ************************************************/

function closeWindow(){

    if(currentStream){

        currentStream
        .getTracks()
        .forEach(
            track => track.stop()
        );
    }

    window.close();
}

</script>

</body>
</html>
